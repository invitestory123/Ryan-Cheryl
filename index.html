<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>The Wedding of Ryan &amp; Cheryl | 03.12.2026 | Goa</title>
  
  <meta property="og:title" content="The Wedding of Ryan & Cheryl" />
  <meta property="og:description" content="Together with our families, we joyfully invite you to celebrate our wedding in Goa on December 3, 2026 at Costa's Countryside, Varca." />
  <meta property="og:image" content="images/envelope_rc_teal.jpg" />
  <meta property="og:type" content="website" />
  
  <link rel="icon" type="image/png" sizes="32x32" href="images/cdn/favicon-light_1.png" />
  <link rel="stylesheet" type="text/css" href="css/fonts.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Great+Vibes&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --gold-primary: #C5A059;
      --gold-light: #E5C378;
      --gold-dark: #8C643C;
      --teal-bg: #023548;
      --teal-dark: #011E29;
      --teal-deep: #022430;
      --font-serif: 'Cinzel', Georgia, serif;
      --font-script: 'Great Vibes', cursive;
      --font-sans: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background: #021822;
      color: #F7EFE4;
      font-family: var(--font-sans);
      overflow-x: hidden;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }

    /* Ambient Luxury Desktop Backdrop */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 30%, rgba(10, 52, 68, 0.75) 0%, rgba(2, 24, 34, 0.95) 70%, #010F15 100%);
      z-index: -1;
      pointer-events: none;
    }

    /* ── TEAL WAX SEAL ENVELOPE OPENING OVERLAY ── */
    #weiOverlay {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: radial-gradient(circle at 50% 45%, #053344 0%, #021E28 65%, #011219 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1), visibility 1.2s ease;
      padding: 20px;
    }

    .wei-envelope-box {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      max-width: min(440px, 90vw);
      max-height: 82vh;
      transition: transform 1.1s cubic-bezier(0.4, 0, 0.2, 1), filter 1.1s ease;
    }

    .wei-envelope-box.is-opening {
      transform: scale(1.06) translateY(-15px);
      filter: brightness(1.15) drop-shadow(0 25px 50px rgba(229, 195, 120, 0.35));
    }

    #weiImg {
      width: 100%;
      max-width: 440px;
      max-height: 76vh;
      display: block;
      object-fit: contain;
      filter: drop-shadow(0 20px 45px rgba(0, 0, 0, 0.7));
      border-radius: 6px;
    }

    /* Ambient Gold Shimmer on the RC Wax Seal */
    .wei-seal-glow {
      position: absolute;
      top: 48%;
      left: 50%;
      width: clamp(90px, 24vw, 130px);
      height: clamp(90px, 24vw, 130px);
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 175, 70, 0.5) 0%, rgba(229, 195, 120, 0.25) 50%, transparent 75%);
      pointer-events: none;
      animation: sealAura 2.6s ease-in-out infinite;
    }

    @keyframes sealAura {
      0%, 100% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.5; }
      50%      { transform: translate(-50%, -50%) scale(1.16); opacity: 0.95; }
    }

    #weiTapWrap {
      position: absolute;
      top: 61.5%;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      animation: weiTapIn 1.2s 0.8s both;
      pointer-events: none;
      z-index: 10;
    }

    @keyframes weiTapIn {
      from { opacity: 0; transform: translateX(-50%) translateY(8px); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    #weiTapLabel {
      font-family: var(--font-serif);
      font-size: clamp(10px, 2.5vw, 12px);
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #E5C378;
      animation: weiPulse 2.4s 1.6s ease-in-out infinite;
      white-space: nowrap;
      font-weight: 600;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9), 0 0 10px rgba(229, 195, 120, 0.6);
    }

    @keyframes weiPulse {
      0%, 100% { opacity: 0.6; letter-spacing: 0.28em; }
      50%      { opacity: 1;   letter-spacing: 0.32em; }
    }

    .wei-chevron {
      width: 10px;
      height: 10px;
      border-right: 1.8px solid #E5C378;
      border-top: 1.8px solid #E5C378;
      transform: rotate(-45deg);
      animation: weiChevron 2.4s 1.9s ease-in-out infinite;
      filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.9));
    }

    @keyframes weiChevron {
      0%, 100% { transform: rotate(-45deg) translate(0, 0); opacity: 0.6; }
      50%      { transform: rotate(-45deg) translate(2px, -2px); opacity: 1; }
    }

    /* ── FLOATING AUDIO BUTTON ── */
    #weiAudioBtn {
      position: fixed;
      bottom: max(20px, env(safe-area-inset-bottom, 20px));
      right: max(20px, env(safe-area-inset-right, 20px));
      width: clamp(46px, 11vw, 54px);
      height: clamp(46px, 11vw, 54px);
      background: linear-gradient(135deg, #741524, #480A13);
      border: 1.5px solid rgba(229, 195, 120, 0.6);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 99998;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
      visibility: hidden;
      opacity: 0;
      transition: opacity 0.4s ease, transform 0.2s ease, box-shadow 0.2s ease;
    }

    #weiAudioBtn:hover {
      transform: scale(1.08);
      box-shadow: 0 8px 24px rgba(229, 195, 120, 0.4);
    }

    #weiAudioBtn svg {
      width: 42%;
      height: 42%;
      fill: #F9F0E0;
    }

    /* ── MAIN INVITATION CONTAINER ── */
    #invitationApp {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      position: relative;
      background: #023548;
      box-shadow: 0 10px 60px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(197, 160, 89, 0.15);
      container-type: inline-size;
      container-name: inviteApp;
    }

    .invite-card {
      position: relative;
      width: 100%;
      display: block;
      overflow: hidden;
      line-height: 0;
      background: #023548;
      container-type: inline-size;
      container-name: card;
    }

    .invite-card-img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }

    /* ── PAGE 2: INTERACTIVE LIVE COUNTDOWN ── */
    .countdown-overlay {
      position: absolute;
      top: 24.6%;
      left: 7.6%;
      width: 84.8%;
      height: 5.2%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
      z-index: 10;
    }

    .countdown-arch-slot {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .countdown-digit {
      font-family: var(--font-serif);
      font-size: clamp(15px, 4.2cqw, 23px);
      font-weight: 700;
      color: #042431;
      line-height: 1;
      letter-spacing: 0.02em;
      filter: drop-shadow(0 1px 1px rgba(255, 255, 255, 0.5));
    }


    /* ── INTERACTIVE BUTTON HOTSPOTS (PAGES 5 & 6) ── */
    .hotspot-btn {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      cursor: pointer;
      border-radius: 30px;
      z-index: 20;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    .hotspot-btn:hover, .hotspot-btn:active {
      transform: scale(1.02);
      box-shadow: 0 0 20px rgba(229, 195, 120, 0.55);
      background-color: rgba(229, 195, 120, 0.08);
    }

    /* Page 5: Open in Maps */
    #btnPage5Maps {
      top: 84.4%;
      left: 20.8%;
      width: 58.4%;
      height: 5.6%;
    }

    /* Page 6: Open in Maps */
    #btnPage6Maps {
      top: 81.6%;
      left: 21.8%;
      width: 56.4%;
      height: 4.6%;
    }

    /* Page 6: Add to Calendar */
    #btnPage6Calendar {
      top: 87.2%;
      left: 21.8%;
      width: 56.4%;
      height: 4.6%;
    }

    /* ── PAGE 7: RSVP INTERACTIVE SECTION ── */
    .rsvp-form-container {
      position: absolute;
      top: 36.2%;
      left: 15.5%;
      width: 69%;
      height: 30.5%;
      z-index: 20;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      line-height: normal;
    }

    .rsvp-row {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .rsvp-label {
      font-family: var(--font-serif);
      font-size: clamp(8.5px, 2cqw, 11px);
      letter-spacing: 0.1em;
      color: #E5C378;
      text-transform: uppercase;
      font-weight: 600;
    }

    .rsvp-input {
      width: 100%;
      background: rgba(2, 28, 38, 0.92);
      border: 1px solid rgba(197, 160, 89, 0.55);
      border-radius: 5px;
      padding: clamp(4px, 1.1cqw, 7px) clamp(6px, 1.5cqw, 10px);
      color: #FFFFFF;
      font-family: var(--font-sans);
      font-size: clamp(9.5px, 2.2cqw, 12px);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .rsvp-input:focus {
      border-color: #E5C378;
      box-shadow: 0 0 10px rgba(229, 195, 120, 0.35);
      background: rgba(2, 28, 38, 0.98);
    }

    .rsvp-input::placeholder {
      color: rgba(229, 195, 120, 0.5);
      font-style: italic;
    }

    .rsvp-options-group {
      display: flex;
      gap: 5px;
    }

    .rsvp-choice-btn {
      flex: 1;
      padding: clamp(4px, 1cqw, 6px) 3px;
      background: rgba(3, 33, 44, 0.9);
      border: 1px solid rgba(197, 160, 89, 0.5);
      border-radius: 5px;
      color: #E5C378;
      font-family: var(--font-serif);
      font-size: clamp(8.5px, 1.9cqw, 10.5px);
      letter-spacing: 0.04em;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
      user-select: none;
      white-space: nowrap;
    }

    .rsvp-choice-btn.active {
      background: linear-gradient(135deg, #C5A059, #8C643C);
      color: #021E28;
      font-weight: 700;
      border-color: #FFE6A8;
      box-shadow: 0 2px 8px rgba(197, 160, 89, 0.4);
    }

    .rsvp-inline-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .rsvp-select {
      background: rgba(2, 28, 38, 0.92);
      border: 1px solid rgba(197, 160, 89, 0.55);
      border-radius: 5px;
      color: #FFFFFF;
      padding: clamp(3px, 0.8cqw, 5px) clamp(4px, 1.2cqw, 8px);
      font-family: var(--font-sans);
      font-size: clamp(9px, 2cqw, 11px);
      outline: none;
      cursor: pointer;
    }

    /* The Gold Confirm Button */
    .rsvp-submit-btn {
      width: 100%;
      height: clamp(28px, 6cqw, 36px);
      background: linear-gradient(135deg, #E5C378 0%, #C5A059 50%, #9C7838 100%);
      border: none;
      border-radius: 20px;
      color: #02202B;
      font-family: var(--font-serif);
      font-size: clamp(9.5px, 2.3cqw, 12px);
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.6);
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 4px;
    }

    .rsvp-submit-btn:hover, .rsvp-submit-btn:active {
      transform: translateY(-1px) scale(1.01);
      box-shadow: 0 6px 22px rgba(229, 195, 120, 0.6);
    }

    /* Success State Card */
    .rsvp-success-card {
      display: none;
      text-align: center;
      padding: clamp(10px, 3cqw, 16px);
      background: rgba(2, 28, 38, 0.96);
      border: 1px solid #E5C378;
      border-radius: 8px;
      box-shadow: 0 0 25px rgba(229, 195, 120, 0.3);
      animation: fadeIn 0.4s ease-out;
      z-index: 30;
      justify-content: center;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to   { opacity: 1; transform: scale(1); }
    }

    .rsvp-success-title {
      font-family: var(--font-serif);
      color: #E5C378;
      font-size: clamp(12px, 3cqw, 15px);
      font-weight: 700;
      margin-bottom: 6px;
      letter-spacing: 0.05em;
    }

    .rsvp-success-msg {
      font-family: var(--font-sans);
      color: #F7EFE4;
      font-size: clamp(9.5px, 2.2cqw, 11.5px);
      line-height: 1.45;
    }

    /* ── FOOTER ── */
    .footer-bar {
      padding: 24px 16px 40px;
      text-align: center;
      background: #023548;
      border-top: 1px solid rgba(197, 160, 89, 0.2);
    }

    .footer-tagline {
      font-family: var(--font-script);
      font-size: 26px;
      color: #E5C378;
      margin-bottom: 8px;
    }

    .footer-names {
      font-family: var(--font-serif);
      font-size: 11px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(247, 239, 228, 0.7);
    }
  </style>
</head>
<body>

  <!-- Background Music Audio: A Thousand Years by Christina Perri -->
  <audio id="weiAudio" loop preload="auto">
    <source src="media/A_Thousand_Years.m4a" type="audio/mp4">
    <source src="media/A_Thousand_Years.m4a" type="audio/x-m4a">
    <source src="media/A_Thousand_Years.m4a" type="audio/aac">
  </audio>

  <!-- Teal RC Wax Seal Envelope Opening Overlay -->
  <div id="weiOverlay" aria-label="Open your royal wedding invitation" role="button">
    <div class="wei-envelope-box" id="weiEnvelopeBox">
      <img id="weiImg"
        src="images/envelope_rc_teal.jpg"
        alt="Royal Wax Seal Envelope - Ryan & Cheryl"
        draggable="false"
      >
      <!-- Gold Shimmer Over Amber RC Wax Seal -->
      <div class="wei-seal-glow"></div>
      
      <!-- Tap to Open Indicator -->
      <div id="weiTapWrap">
        <div class="wei-chevron"></div>
        <div id="weiTapLabel">Tap to open</div>
      </div>
    </div>
  </div>

  <!-- Persistent Floating Music Button -->
  <div id="weiAudioBtn" title="Toggle Music: A Thousand Years" aria-label="Toggle Music: A Thousand Years">
    <svg id="weiIconPause" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" style="display:block">
      <rect x="6" y="5" width="4" height="14" rx="1"/>
      <rect x="14" y="5" width="4" height="14" rx="1"/>
    </svg>
    <svg id="weiIconPlay" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" style="display:none">
      <polygon points="6,4 20,12 6,20"/>
    </svg>
  </div>

  <!-- Main Invitation Booklet Container -->
  <main id="invitationApp">

    <!-- PAGE 1: HERO / ANNOUNCEMENT -->
    <section class="invite-card" id="page1" aria-label="The Wedding of Ryan and Cheryl">
      <img
        class="invite-card-img"
        src="images/page1_hero_ryan_cheryl.jpg"
        alt="The Wedding of Ryan & Cheryl - 03.12.2026 - Goa"
        loading="eager"
      />
    </section>

    <!-- PAGE 2: OUR CELEBRATION COUNTDOWN BEGINS -->
    <section class="invite-card" id="page2" aria-label="Wedding Countdown">
      <img
        class="invite-card-img"
        src="images/page2_countdown_clean.jpg"
        alt="Our Celebration Countdown Begins - Ryan & Cheryl"
        loading="lazy"
        onerror="this.src='images/page2_countdown.jpg';"
      />
      <!-- Dynamic Live Countdown Overlaid Directly Inside The 4 Arches -->
      <div class="countdown-overlay" id="countdownTimer" aria-live="polite">
        <div class="countdown-arch-slot">
          <span class="countdown-digit" id="cdDays">00</span>
        </div>
        <div class="countdown-arch-slot">
          <span class="countdown-digit" id="cdHours">00</span>
        </div>
        <div class="countdown-arch-slot">
          <span class="countdown-digit" id="cdMinutes">00</span>
        </div>
        <div class="countdown-arch-slot">
          <span class="countdown-digit" id="cdSeconds">00</span>
        </div>
      </div>
    </section>


    <!-- PAGE 4: EVERY LOVELY MOMENT (SCHEDULE) -->
    <section class="invite-card" id="page4" aria-label="Schedule of Events">
      <img
        class="invite-card-img"
        src="images/page4_schedule.jpg"
        alt="Every Lovely Moment: 11:00 AM Nuptials, 7:00 PM Reception, 8:30 PM Dance, 10:00 PM Dinner"
        loading="lazy"
      />
    </section>

    <!-- PAGE 5: THE NUPTIALS (HOLY SPIRIT CHURCH, MARGAO) -->
    <section class="invite-card" id="page5" aria-label="Church Nuptials Ceremony">
      <img
        class="invite-card-img"
        src="images/page5_church.png"
        alt="The Nuptials at Holy Spirit Church, Margao, Goa"
        loading="lazy"
      />
      <!-- Interactive Google Maps Link -->
      <a
        id="btnPage5Maps"
        class="hotspot-btn"
        href="https://www.google.com/maps/search/?api=1&query=Holy+Spirit+Church+Holy+Spirit+Road+Borda+Margao+Goa+403601"
        target="_blank"
        rel="noopener noreferrer"
        title="Open Holy Spirit Church in Google Maps"
        aria-label="Open Holy Spirit Church Margao in Google Maps"
      ></a>
    </section>

    <!-- PAGE 6: WHERE WE CELEBRATE (COSTA'S COUNTRYSIDE, VARCA) -->
    <section class="invite-card" id="page6" aria-label="Reception Venue: Costa's Countryside, Varca">
      <img
        class="invite-card-img"
        src="images/page6_venue.png"
        alt="Where We Celebrate - Costa's Countryside, Varca, Goa"
        loading="lazy"
      />
      <!-- Interactive Google Maps Link -->
      <a
        id="btnPage6Maps"
        class="hotspot-btn"
        href="https://www.google.com/maps/search/?api=1&query=Costa%27s+Countryside+Varca+Beach+Road+Varca+Goa+403721"
        target="_blank"
        rel="noopener noreferrer"
        title="Open Costa's Countryside in Google Maps"
        aria-label="Open Costa's Countryside Varca in Google Maps"
      ></a>
      <!-- Interactive Add to Calendar Link -->
      <a
        id="btnPage6Calendar"
        class="hotspot-btn"
        href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=The+Wedding+of+Ryan+%26+Cheryl&dates=20261203T053000Z/20261203T183000Z&details=Together+with+our+families%2C+we+joyfully+invite+you+to+celebrate+our+wedding.%0A%0A11%3A00+AM+-+Nuptials+at+Holy+Spirit+Church%2C+Margao%0A7%3A00+PM+-+Reception+at+Costa%27s+Countryside%2C+Varca%0A8%3A30+PM+-+Dance%0A10%3A00+PM+-+Dinner&location=Costa%27s+Countryside%2C+Varca+Beach+Road%2C+Varca%2C+Goa+403721%2C+India"
        target="_blank"
        rel="noopener noreferrer"
        title="Add to Google Calendar"
        aria-label="Add Ryan & Cheryl's Wedding to Google Calendar"
      ></a>
    </section>

    <!-- PAGE 7: RSVP SECTION -->
    <section class="invite-card" id="page7" aria-label="RSVP Response">
      <img
        class="invite-card-img"
        src="images/page7_rsvp_clean.jpg"
        alt="RSVP - Kindly respond by November 15, 2026"
        loading="lazy"
        onerror="this.src='images/page7_rsvp.jpg';"
      />
      
      <!-- Interactive RSVP Form Embedded In Ornate Frame -->
      <form class="rsvp-form-container" id="rsvpForm" onsubmit="handleRsvpSubmit(event)">
        <!-- Guest Name -->
        <div class="rsvp-row">
          <label class="rsvp-label" for="guestName">Guest Name(s)</label>
          <input
            type="text"
            id="guestName"
            name="guestName"
            class="rsvp-input"
            placeholder="e.g. Maria & John"
            required
            autocomplete="name"
          />
        </div>

        <!-- Attendance Status -->
        <div class="rsvp-row">
          <div class="rsvp-options-group">
            <button
              type="button"
              class="rsvp-choice-btn active"
              id="optAttending"
              onclick="selectAttendance('attending')"
            >
              Joyfully Accepts
            </button>
            <button
              type="button"
              class="rsvp-choice-btn"
              id="optDeclining"
              onclick="selectAttendance('declining')"
            >
              Regretfully Declines
            </button>
          </div>
          <input type="hidden" id="attendanceVal" name="attendance" value="attending" />
        </div>

        <!-- Number of Guests & Events -->
        <div class="rsvp-inline-row" id="guestCountRow">
          <div style="flex: 1;">
            <label class="rsvp-label" for="guestCount">Guests</label>
            <select id="guestCount" name="guestCount" class="rsvp-select" style="width: 100%;">
              <option value="1">1 Guest</option>
              <option value="2" selected>2 Guests</option>
              <option value="3">3 Guests</option>
              <option value="4">4 Guests</option>
              <option value="5+">5+ Guests</option>
            </select>
          </div>
          <div style="flex: 1.5;">
            <label class="rsvp-label" for="attendingEvents">Events</label>
            <select id="attendingEvents" name="attendingEvents" class="rsvp-select" style="width: 100%;">
              <option value="both" selected>Nuptials &amp; Reception</option>
              <option value="reception">Reception Only</option>
              <option value="nuptials">Nuptials Only</option>
            </select>
          </div>
        </div>

        <!-- Warm Note / Wishes -->
        <div class="rsvp-row">
          <input
            type="text"
            id="guestWishes"
            name="guestWishes"
            class="rsvp-input"
            placeholder="Wishes or dietary notes..."
          />
        </div>

        <!-- Submit Button -->
        <button type="submit" class="rsvp-submit-btn" id="btnSubmitRsvp">
          Confirm RSVP
        </button>
      </form>

      <!-- Confirmation Feedback Card -->
      <div class="rsvp-form-container rsvp-success-card" id="rsvpSuccess">
        <div class="rsvp-success-title">Warm Thanks!</div>
        <p class="rsvp-success-msg" id="rsvpSuccessText">
          Thank you! We have received your RSVP and look forward to celebrating with you in Goa!
        </p>
      </div>
    </section>

    <!-- Footer -->
    <footer class="footer-bar">
      <div class="footer-tagline">Ryan &amp; Cheryl</div>
      <div class="footer-names">December 3, 2026 &bull; Costa's Countryside, Varca, Goa</div>
    </footer>

  </main>

  <script>
    /* ── TEAL RC ENVELOPE OPENING & "A THOUSAND YEARS" AUDIO LOGIC ── */
    (function () {
      var overlay     = document.getElementById('weiOverlay');
      var envBox      = document.getElementById('weiEnvelopeBox');
      var audio       = document.getElementById('weiAudio');
      var audioBtn    = document.getElementById('weiAudioBtn');
      var iconPause   = document.getElementById('weiIconPause');
      var iconPlay    = document.getElementById('weiIconPlay');
      var done        = false;

      function openEnvelope() {
        if (done) return;
        done = true;

        // Envelope unsealing visual feedback
        envBox.classList.add('is-opening');

        // Start playing "A Thousand Years"
        audio.volume = 0.85;
        var playPromise = audio.play();
        if (playPromise && playPromise.catch) {
          playPromise.catch(function () {
            // In case of browser strict autoplay policy
          });
        }

        // Smooth fade out of envelope overlay
        setTimeout(function () {
          overlay.style.opacity = '0';
          overlay.style.pointerEvents = 'none';
        }, 700);

        setTimeout(function () {
          overlay.style.display = 'none';
          // Show persistent music button
          audioBtn.style.visibility = 'visible';
          audioBtn.style.opacity = '1';
        }, 1800);
      }

      overlay.addEventListener('click', openEnvelope);
      overlay.addEventListener('touchstart', openEnvelope, { passive: true });

      // Audio toggle button handler
      audioBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        if (audio.paused) {
          audio.play();
          iconPlay.style.display = 'none';
          iconPause.style.display = 'block';
        } else {
          audio.pause();
          iconPlay.style.display = 'block';
          iconPause.style.display = 'none';
        }
      });
    })();

    /* ── DYNAMIC LIVE COUNTDOWN TO DECEMBER 3, 2026, 11:00 AM IST ── */
    (function () {
      // 3 December 2026, 11:00:00 GMT+05:30 (IST)
      var targetDate = new Date('2026-12-03T11:00:00+05:30').getTime();

      var elDays    = document.getElementById('cdDays');
      var elHours   = document.getElementById('cdHours');
      var elMinutes = document.getElementById('cdMinutes');
      var elSeconds = document.getElementById('cdSeconds');

      function padZero(num) {
        return num < 10 ? '0' + num : num.toString();
      }

      function updateCountdown() {
        var now = new Date().getTime();
        var diff = targetDate - now;

        if (diff <= 0) {
          elDays.textContent    = '00';
          elHours.textContent   = '00';
          elMinutes.textContent = '00';
          elSeconds.textContent = '00';
          return;
        }

        var days = Math.floor(diff / (1000 * 60 * 60 * 24));
        var hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        var minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        var seconds = Math.floor((diff % (1000 * 60)) / 1000);

        elDays.textContent    = padZero(days);
        elHours.textContent   = padZero(hours);
        elMinutes.textContent = padZero(minutes);
        elSeconds.textContent = padZero(seconds);
      }

      updateCountdown();
      setInterval(updateCountdown, 1000);
    })();

    /* ── RSVP FORM CONTROLLER ── */
    function selectAttendance(status) {
      var optAttending = document.getElementById('optAttending');
      var optDeclining = document.getElementById('optDeclining');
      var attendanceVal = document.getElementById('attendanceVal');
      var guestCountRow = document.getElementById('guestCountRow');

      attendanceVal.value = status;
      if (status === 'attending') {
        optAttending.classList.add('active');
        optDeclining.classList.remove('active');
        guestCountRow.style.display = 'flex';
      } else {
        optDeclining.classList.add('active');
        optAttending.classList.remove('active');
        guestCountRow.style.display = 'none';
      }
    }

    function handleRsvpSubmit(e) {
      e.preventDefault();
      var form = document.getElementById('rsvpForm');
      var successCard = document.getElementById('rsvpSuccess');
      var successText = document.getElementById('rsvpSuccessText');

      var name = document.getElementById('guestName').value.trim();
      var attendance = document.getElementById('attendanceVal').value;
      var guests = document.getElementById('guestCount').value;
      var events = document.getElementById('attendingEvents').value;
      var wishes = document.getElementById('guestWishes').value.trim();

      var rsvpData = {
        name: name,
        attendance: attendance,
        guests: attendance === 'attending' ? guests : 0,
        events: attendance === 'attending' ? events : 'None',
        wishes: wishes,
        timestamp: new Date().toISOString()
      };

      try {
        localStorage.setItem('ryan_cheryl_rsvp', JSON.stringify(rsvpData));
      } catch (err) {}

      form.style.display = 'none';
      successCard.style.display = 'flex';

      if (attendance === 'attending') {
        successText.innerHTML = 'Dear <strong>' + name + '</strong>, we are thrilled to celebrate with you at Costa\'s Countryside in Goa on December 3, 2026!';
      } else {
        successText.innerHTML = 'Dear <strong>' + name + '</strong>, thank you for letting us know. You will be dearly missed on our special day.';
      }
    }
  </script>
</body>
</html>
