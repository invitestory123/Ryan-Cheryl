<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>The Wedding of Ryan &amp; Cheryl | 03.12.2026 | Goa</title>
  
  <meta property="og:title" content="The Wedding of Ryan & Cheryl" />
  <meta property="og:description" content="Together with our families, we joyfully invite you to celebrate our wedding in Goa on December 3, 2026 at Costa's Countryside, Varca." />
  <meta property="og:image" content="images/envelope_rc_teal.jpg" />
  <meta property="og:type" content="website" />
  
  <link rel="icon" type="image/png" sizes="32x32" href="images/cdn/favicon-light_1.png" />
  <link rel="stylesheet" type="text/css" href="css/fonts.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Great+Vibes&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --gold-primary: #C5A059;
      --gold-light: #E5C378;
      --gold-dark: #8C643C;
      --teal-bg: #023548;
      --teal-dark: #011E29;
      --teal-deep: #022430;
      --font-serif: 'Cinzel', Georgia, serif;
      --font-script: 'Great Vibes', cursive;
      --font-sans: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background: #021822;
      color: #F7EFE4;
      font-family: var(--font-sans);
      overflow-x: hidden;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }

    /* Ambient Luxury Desktop Backdrop */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 30%, rgba(10, 52, 68, 0.75) 0%, rgba(2, 24, 34, 0.95) 70%, #010F15 100%);
      z-index: -1;
      pointer-events: none;
    }

    /* ── TEAL WAX SEAL ENVELOPE OPENING OVERLAY ── */
    #weiOverlay {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: radial-gradient(circle at 50% 45%, #053344 0%, #021E28 65%, #011219 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1), visibility 1.2s ease;
      padding: 20px;
    }

    .wei-envelope-box {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      max-width: min(440px, 90vw);
      max-height: 82vh;
      transition: transform 1.1s cubic-bezier(0.4, 0, 0.2, 1), filter 1.1s ease;
    }

    .wei-envelope-box.is-opening {
      transform: scale(1.06) translateY(-15px);
      filter: brightness(1.15) drop-shadow(0 25px 50px rgba(229, 195, 120, 0.35));
    }

    #weiImg {
      width: 100%;
      max-width: 440px;
      max-height: 76vh;
      display: block;
      object-fit: contain;
      filter: drop-shadow(0 20px 45px rgba(0, 0, 0, 0.7));
      border-radius: 6px;
    }

    /* Ambient Gold Shimmer on the RC Wax Seal */
    .wei-seal-glow {
      position: absolute;
      top: 48%;
      left: 50%;
      width: clamp(90px, 24vw, 130px);
      height: clamp(90px, 24vw, 130px);
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 175, 70, 0.5) 0%, rgba(229, 195, 120, 0.25) 50%, transparent 75%);
      pointer-events: none;
      animation: sealAura 2.6s ease-in-out infinite;
    }

    @keyframes sealAura {
      0%, 100% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.5; }
      50%      { transform: translate(-50%, -50%) scale(1.16); opacity: 0.95; }
    }

    #weiTapWrap {
      position: absolute;
      top: 61.5%;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      animation: weiTapIn 1.2s 0.8s both;
      pointer-events: none;
      z-index: 10;
    }

    @keyframes weiTapIn {
      from { opacity: 0; transform: translateX(-50%) translateY(8px); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    #weiTapLabel {
      font-family: var(--font-serif);
      font-size: clamp(10px, 2.5vw, 12px);
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #E5C378;
      animation: weiPulse 2.4s 1.6s ease-in-out infinite;
      white-space: nowrap;
      font-weight: 600;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9), 0 0 10px rgba(229, 195, 120, 0.6);
    }

    @keyframes weiPulse {
      0%, 100% { opacity: 0.6; letter-spacing: 0.28em; }
      50%      { opacity: 1;   letter-spacing: 0.32em; }
    }

    .wei-chevron {
      width: 10px;
      height: 10px;
      border-right: 1.8px solid #E5C378;
      border-top: 1.8px solid #E5C378;
      transform: rotate(-45deg);
      animation: weiChevron 2.4s 1.9s ease-in-out infinite;
      filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.9));
    }

    @keyframes weiChevron {
      0%, 100% { transform: rotate(-45deg) translate(0, 0); opacity: 0.6; }
      50%      { transform: rotate(-45deg) translate(2px, -2px); opacity: 1; }
    }

    /* ── FLOATING AUDIO BUTTON ── */
    #weiAudioBtn {
      position: fixed;
      bottom: max(20px, env(safe-area-inset-bottom, 20px));
      right: max(20px, env(safe-area-inset-right, 20px));
      width: clamp(46px, 11vw, 54px);
      height: clamp(46px, 11vw, 54px);
      background: linear-gradient(135deg, #741524, #480A13);
      border: 1.5px solid rgba(229, 195, 120, 0.6);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 99998;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
      visibility: hidden;
      opacity: 0;
      transition: opacity 0.4s ease, transform 0.2s ease, box-shadow 0.2s ease;
    }

    #weiAudioBtn:hover {
      transform: scale(1.08);
      box-shadow: 0 8px 24px rgba(229, 195, 120, 0.4);
    }

    #weiAudioBtn svg {
      width: 42%;
      height: 42%;
      fill: #F9F0E0;
    }

    /* ── MAIN INVITATION CONTAINER ── */
    #invitationApp {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      position: relative;
      background: #023548;
      box-shadow: 0 10px 60px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(197, 160, 89, 0.15);
      container-type: inline-size;
      container-name: inviteApp;
    }

    .invite-card {
      position: relative;
      width: 100%;
      display: block;
      overflow: hidden;
      line-height: 0;
      background: #023548;
      container-type: inline-size;
      container-name: card;
    }

    .invite-card-img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }

    /* ── PAGE 2: INTERACTIVE LIVE COUNTDOWN ── */
    .countdown-overlay {
      position: absolute;
      top: 24.6%;
      left: 7.6%;
      width: 84.8%;
      height: 5.2%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
      z-index: 10;
    }

    .countdown-arch-slot {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .countdown-digit {
      font-family: var(--font-serif);
      font-size: clamp(15px, 4.2cqw, 23px);
      font-weight: 700;
      color: #042431;
      line-height: 1;
      letter-spacing: 0.02em;
      filter: drop-shadow(0 1px 1px rgba(255, 255, 255, 0.5));
    }


    /* ── INTERACTIVE BUTTON HOTSPOTS (PAGES 5 & 6) ── */
    .hotspot-btn {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      cursor: pointer;
      border-radius: 30px;
      z-index: 20;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    .hotspot-btn:hover, .hotspot-btn:active {
      transform: scale(1.02);
      box-shadow: 0 0 20px rgba(229, 195, 120, 0.55);
      background-color: rgba(229, 195, 120, 0.08);
    }

    /* Page 5: Open in Maps */
    #btnPage5Maps {
      top: 84.4%;
      left: 20.8%;
      width: 58.4%;
      height: 5.6%;
    }

    /* Page 6: Open in Maps */
    #btnPage6Maps {
      top: 81.6%;
      left: 21.8%;
      width: 56.4%;
      height: 4.6%;
    }

    /* Page 6: Add to Calendar */
    #btnPage6Calendar {
      top: 87.2%;
      left: 21.8%;
      width: 56.4%;
      height: 4.6%;
    }

    /* ── PAGE 7: PLAIN ARCHED LUXURY RSVP SECTION ── */
    .rsvp-plain-card {
      position: relative;
      width: 100%;
      background: radial-gradient(circle at 50% 25%, #053b4e 0%, #022b3b 50%, #011822 100%);
      padding: clamp(28px, 6cqw, 42px) clamp(16px, 4cqw, 24px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.6);
      container-type: inline-size;
      container-name: rsvpCard;
    }

    .rsvp-plain-arch-outer {
      width: 100%;
      max-width: 440px;
      border: 1.5px solid rgba(229, 195, 120, 0.7);
      border-radius: 200px 200px 20px 20px;
      padding: 5px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.45);
      background: rgba(2, 28, 38, 0.35);
    }

    .rsvp-plain-arch-inner {
      width: 100%;
      border: 1px solid rgba(229, 195, 120, 0.4);
      border-radius: 194px 194px 15px 15px;
      padding: clamp(26px, 6cqw, 38px) clamp(18px, 4cqw, 28px) clamp(24px, 5cqw, 32px);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      background: rgba(2, 28, 38, 0.45);
      position: relative;
    }

    .rsvp-top-deco {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      margin-bottom: 10px;
    }

    .rsvp-h-line {
      height: 1px;
      flex: 1;
      max-width: 55px;
      background: linear-gradient(90deg, transparent, rgba(229, 195, 120, 0.65), transparent);
    }

    .rsvp-envelope-svg {
      width: 22px;
      height: 22px;
      color: #E5C378;
      filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.5));
    }

    .rsvp-heading-script {
      font-family: var(--font-script);
      font-size: clamp(28px, 7.2cqw, 38px);
      color: #E5C378;
      line-height: 1.1;
      font-weight: 400;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
      letter-spacing: 0.02em;
    }

    .rsvp-heading-title {
      font-family: var(--font-serif);
      font-size: clamp(17px, 4.4cqw, 23px);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #FFF8EE;
      font-weight: 600;
      margin-top: 3px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
    }

    .rsvp-heart-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      margin: 10px 0 12px;
    }

    .rsvp-heart-glyph {
      color: #E5C378;
      font-size: 11px;
      line-height: 1;
      filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.6));
    }

    .rsvp-subtitle {
      font-family: var(--font-sans);
      font-size: clamp(11px, 2.6cqw, 13px);
      color: rgba(247, 239, 228, 0.88);
      line-height: 1.55;
      max-width: 320px;
      margin: 0 auto 12px;
      font-weight: 400;
    }

    .rsvp-diamond-glyph {
      color: #C5A059;
      font-size: 8px;
      line-height: 1;
      margin-bottom: 18px;
    }

    .rsvp-plain-form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
      text-align: left;
    }

    .rsvp-field-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
      width: 100%;
    }

    .rsvp-field-label {
      font-family: var(--font-sans);
      font-size: clamp(11.5px, 2.6cqw, 13px);
      color: #F7EFE4;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    .rsvp-field-input {
      width: 100%;
      background: rgba(2, 22, 30, 0.85);
      border: 1px solid rgba(197, 160, 89, 0.55);
      border-radius: 7px;
      padding: clamp(9px, 2.3cqw, 12px) 14px;
      color: #FFFFFF;
      font-family: var(--font-sans);
      font-size: clamp(12px, 2.7cqw, 14px);
      outline: none;
      transition: border-color 0.25s, box-shadow 0.25s, background-color 0.25s;
    }

    .rsvp-field-input:focus {
      border-color: #E5C378;
      box-shadow: 0 0 14px rgba(229, 195, 120, 0.35);
      background: rgba(2, 22, 30, 0.98);
    }

    .rsvp-field-input::placeholder {
      color: rgba(229, 195, 120, 0.45);
      font-style: normal;
    }

    .rsvp-select-wrapper {
      position: relative;
      width: 100%;
    }

    .rsvp-field-select {
      width: 100%;
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      background: rgba(2, 22, 30, 0.85);
      border: 1px solid rgba(197, 160, 89, 0.55);
      border-radius: 7px;
      padding: clamp(9px, 2.3cqw, 12px) 36px clamp(9px, 2.3cqw, 12px) 14px;
      color: #FFFFFF;
      font-family: var(--font-sans);
      font-size: clamp(12px, 2.7cqw, 14px);
      outline: none;
      cursor: pointer;
      transition: border-color 0.25s, box-shadow 0.25s, background-color 0.25s;
    }

    .rsvp-field-select:focus {
      border-color: #E5C378;
      box-shadow: 0 0 14px rgba(229, 195, 120, 0.35);
      background: rgba(2, 22, 30, 0.98);
    }

    .rsvp-field-select option {
      background: #02202B;
      color: #F7EFE4;
      padding: 10px;
    }

    .rsvp-select-chevron {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: #E5C378;
      font-size: 13px;
    }

    .rsvp-action-btn {
      width: 100%;
      background: linear-gradient(135deg, #ECCB84 0%, #D4AF37 50%, #A47D28 100%);
      border: none;
      border-radius: 26px;
      color: #021C27;
      font-family: var(--font-serif);
      font-size: clamp(11px, 2.6cqw, 13px);
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
      padding: clamp(10px, 2.6cqw, 13px) 20px;
      margin-top: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.6);
      transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .rsvp-action-btn:hover, .rsvp-action-btn:active {
      transform: translateY(-1px) scale(1.01);
      box-shadow: 0 6px 24px rgba(229, 195, 120, 0.6);
      filter: brightness(1.05);
    }

    .rsvp-btn-svg {
      width: 16px;
      height: 16px;
    }

    .rsvp-deadline-text {
      font-family: var(--font-serif);
      font-size: clamp(10px, 2.3cqw, 11.5px);
      letter-spacing: 0.08em;
      color: rgba(229, 195, 120, 0.85);
      text-transform: uppercase;
      font-weight: 500;
    }

    /* Success State */
    .rsvp-plain-success {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(16px, 4cqw, 24px) 12px;
      animation: fadeIn 0.45s ease-out both;
      width: 100%;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to   { opacity: 1; transform: scale(1); }
    }

    .rsvp-success-heart {
      color: #E5C378;
      font-size: 26px;
      margin-bottom: 8px;
      animation: pulseHeart 1.8s ease-in-out infinite;
    }

    @keyframes pulseHeart {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.2); }
    }

    .rsvp-success-title {
      font-family: var(--font-serif);
      font-size: clamp(16px, 4.2cqw, 21px);
      color: #E5C378;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .rsvp-success-msg {
      font-family: var(--font-sans);
      font-size: clamp(12px, 2.8cqw, 14px);
      color: #F7EFE4;
      line-height: 1.6;
      margin-bottom: 18px;
      max-width: 320px;
    }

    .rsvp-whatsapp-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #25D366;
      color: #FFFFFF;
      font-family: var(--font-sans);
      font-size: clamp(11.5px, 2.5cqw, 13px);
      font-weight: 600;
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 24px;
      box-shadow: 0 4px 15px rgba(37, 211, 102, 0.35);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .rsvp-whatsapp-btn:hover {
      transform: translateY(-1px) scale(1.02);
      box-shadow: 0 6px 20px rgba(37, 211, 102, 0.5);
    }

    /* ── FOOTER ── */
    .footer-bar {
      padding: 24px 16px 40px;
      text-align: center;
      background: #023548;
      border-top: 1px solid rgba(197, 160, 89, 0.2);
    }

    .footer-tagline {
      font-family: var(--font-script);
      font-size: 26px;
      color: #E5C378;
      margin-bottom: 8px;
    }

    .footer-names {
      font-family: var(--font-serif);
      font-size: 11px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(247, 239, 228, 0.7);
    }
  </style>
</head>
<body>

  <!-- Background Music Audio: A Thousand Years by Christina Perri -->
  <audio id="weiAudio" loop preload="auto">
    <source src="media/A_Thousand_Years.m4a" type="audio/mp4">
    <source src="media/A_Thousand_Years.m4a" type="audio/x-m4a">
    <source src="media/A_Thousand_Years.m4a" type="audio/aac">
  </audio>

  <!-- Teal RC Wax Seal Envelope Opening Overlay -->
  <div id="weiOverlay" aria-label="Open your royal wedding invitation" role="button">
    <div class="wei-envelope-box" id="weiEnvelopeBox">
      <img id="weiImg"
        src="images/envelope_rc_teal.jpg"
        alt="Royal Wax Seal Envelope - Ryan & Cheryl"
        draggable="false"
      >
      <!-- Gold Shimmer Over Amber RC Wax Seal -->
      <div class="wei-seal-glow"></div>
      
      <!-- Tap to Open Indicator -->
      <div id="weiTapWrap">
        <div class="wei-chevron"></div>
        <div id="weiTapLabel">Tap to open</div>
      </div>
    </div>
  </div>

  <!-- Persistent Floating Music Button -->
  <div id="weiAudioBtn" title="Toggle Music: A Thousand Years" aria-label="Toggle Music: A Thousand Years">
    <svg id="weiIconPause" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" style="display:block">
      <rect x="6" y="5" width="4" height="14" rx="1"/>
      <rect x="14" y="5" width="4" height="14" rx="1"/>
    </svg>
    <svg id="weiIconPlay" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" style="display:none">
      <polygon points="6,4 20,12 6,20"/>
    </svg>
  </div>

  <!-- Main Invitation Booklet Container -->
  <main id="invitationApp">

    <!-- PAGE 1: HERO / ANNOUNCEMENT -->
    <section class="invite-card" id="page1" aria-label="The Wedding of Ryan and Cheryl">
      <img
        class="invite-card-img"
        src="images/page1_hero_ryan_cheryl.jpg"
        alt="The Wedding of Ryan & Cheryl - 03.12.2026 - Goa"
        loading="eager"
      />
    </section>

    <!-- PAGE 2: OUR CELEBRATION COUNTDOWN BEGINS -->
    <section class="invite-card" id="page2" aria-label="Wedding Countdown">
      <img
        class="invite-card-img"
        src="images/page2_countdown_clean.jpg"
        alt="Our Celebration Countdown Begins - Ryan & Cheryl"
        loading="lazy"
        onerror="this.src='images/page2_countdown.jpg';"
      />
      <!-- Dynamic Live Countdown Overlaid Directly Inside The 4 Arches -->
      <div class="countdown-overlay" id="countdownTimer" aria-live="polite">
        <div class="countdown-arch-slot">
          <span class="countdown-digit" id="cdDays">00</span>
        </div>
        <div class="countdown-arch-slot">
          <span class="countdown-digit" id="cdHours">00</span>
        </div>
        <div class="countdown-arch-slot">
          <span class="countdown-digit" id="cdMinutes">00</span>
        </div>
        <div class="countdown-arch-slot">
          <span class="countdown-digit" id="cdSeconds">00</span>
        </div>
      </div>
    </section>

  <script>
    /* ── TEAL RC ENVELOPE OPENING & "A THOUSAND YEARS" AUDIO LOGIC ── */
    (function () {
      var overlay     = document.getElementById('weiOverlay');
      var envBox      = document.getElementById('weiEnvelopeBox');
      var audio       = document.getElementById('weiAudio');
      var audioBtn    = document.getElementById('weiAudioBtn');
      var iconPause   = document.getElementById('weiIconPause');
      var iconPlay    = document.getElementById('weiIconPlay');
      var done        = false;

      function openEnvelope() {
        if (done) return;
        done = true;

        // Envelope unsealing visual feedback
        envBox.classList.add('is-opening');

        // Start playing "A Thousand Years"
        audio.volume = 0.85;
        var playPromise = audio.play();
        if (playPromise && playPromise.catch) {
          playPromise.catch(function () {
            // In case of browser strict autoplay policy
          });
        }

        // Smooth fade out of envelope overlay
        setTimeout(function () {
          overlay.style.opacity = '0';
          overlay.style.pointerEvents = 'none';
        }, 700);

        setTimeout(function () {
          overlay.style.display = 'none';
          // Show persistent music button
          audioBtn.style.visibility = 'visible';
          audioBtn.style.opacity = '1';
        }, 1800);
      }

      overlay.addEventListener('click', openEnvelope);
      overlay.addEventListener('touchstart', openEnvelope, { passive: true });

      // Audio toggle button handler
      audioBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        if (audio.paused) {
          audio.play();
          iconPlay.style.display = 'none';
          iconPause.style.display = 'block';
        } else {
          audio.pause();
          iconPlay.style.display = 'block';
          iconPause.style.display = 'none';
        }
      });
    })();

    /* ── DYNAMIC LIVE COUNTDOWN TO DECEMBER 3, 2026, 11:00 AM IST ── */
    (function () {
      // 3 December 2026, 11:00:00 GMT+05:30 (IST)
      var targetDate = new Date('2026-12-03T11:00:00+05:30').getTime();

      var elDays    = document.getElementById('cdDays');
      var elHours   = document.getElementById('cdHours');
      var elMinutes = document.getElementById('cdMinutes');
      var elSeconds = document.getElementById('cdSeconds');

      function padZero(num) {
        return num < 10 ? '0' + num : num.toString();
      }

      function updateCountdown() {
        var now = new Date().getTime();
        var diff = targetDate - now;

        if (diff <= 0) {
          elDays.textContent    = '00';
          elHours.textContent   = '00';
          elMinutes.textContent = '00';
          elSeconds.textContent = '00';
          return;
        }

        var days = Math.floor(diff / (1000 * 60 * 60 * 24));
        var hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        var minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        var seconds = Math.floor((diff % (1000 * 60)) / 1000);

        elDays.textContent    = padZero(days);
        elHours.textContent   = padZero(hours);
        elMinutes.textContent = padZero(minutes);
        elSeconds.textContent = padZero(seconds);
      }

      updateCountdown();
      setInterval(updateCountdown, 1000);
    })();

    /* ── RSVP FORM CONTROLLER (PLAIN ARCHED LUXURY STYLE) ── */
    function handleRsvpSubmit(e) {
      e.preventDefault();
      var form = document.getElementById('rsvpForm');
      var successCard = document.getElementById('rsvpSuccess');
      var successText = document.getElementById('rsvpSuccessText');
      var waBtn = document.getElementById('rsvpWhatsappBtn');

      var nameInput = document.getElementById('guestName');
      var attendanceSelect = document.getElementById('rsvpAttendance');

      var name = nameInput.value.trim();
      var attendance = attendanceSelect.value;

      if (!name || !attendance) {
        return;
      }

      var rsvpData = {
        name: name,
        attendance: attendance,
        timestamp: new Date().toISOString()
      };

      try {
        localStorage.setItem('ryan_cheryl_rsvp', JSON.stringify(rsvpData));
      } catch (err) {}

      form.style.display = 'none';
      successCard.style.display = 'flex';

      if (attendance === 'attending') {
        successText.innerHTML = 'Dear <strong>' + name + '</strong>,<br>We are truly overjoyed and look forward to celebrating our wedding with you at Costa\'s Countryside, Goa on December 3, 2026!';
        var msg = encodeURIComponent('Hi Ryan & Cheryl, I (' + name + ') joyfully accept your wedding invitation for December 3, 2026 in Goa! ✨');
        waBtn.href = 'https://api.whatsapp.com/send?text=' + msg;
        waBtn.style.display = 'inline-flex';
      } else {
        successText.innerHTML = 'Dear <strong>' + name + '</strong>,<br>Thank you for letting us know. You will be dearly missed on our special day.';
        var msg = encodeURIComponent('Hi Ryan & Cheryl, thank you so much for the lovely wedding invitation. Regretfully I (' + name + ') will be unable to attend, but sending you both my heartfelt congratulations!');
        waBtn.href = 'https://api.whatsapp.com/send?text=' + msg;
        waBtn.style.display = 'inline-flex';
      }
    }
  </script>
