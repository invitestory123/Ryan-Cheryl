<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>The Wedding of Ryan &amp; Cheryl | 03.12.2026 | Goa</title>
  
  <meta property="og:title" content="The Wedding of Ryan & Cheryl" />
  <meta property="og:description" content="Together with our families, we joyfully invite you to celebrate our wedding in Goa on December 3, 2026 at Costa's Countryside, Varca." />
  <meta property="og:image" content="images/envelope_rc_teal.jpg" />
  <meta property="og:type" content="website" />
  
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-light_1.png" />
  <link rel="stylesheet" type="text/css" href="css/fonts.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Great+Vibes&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --gold-primary: #C5A059;
      --gold-light: #E5C378;
      --gold-dark: #8C643C;
      --teal-bg: #023548;
      --teal-dark: #011E29;
      --teal-deep: #022430;
      --font-serif: 'Cinzel', Georgia, serif;
      --font-script: 'Great Vibes', cursive;
      --font-sans: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background: #021822;
      color: #F7EFE4;
      font-family: var(--font-sans);
      overflow-x: hidden;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }

    /* Ambient Luxury Desktop Backdrop */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 30%, rgba(10, 52, 68, 0.75) 0%, rgba(2, 24, 34, 0.95) 70%, #010F15 100%);
      z-index: -1;
      pointer-events: none;
    }

    /* ── TEAL WAX SEAL ENVELOPE OPENING OVERLAY ── */
    #weiOverlay {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: radial-gradient(circle at 50% 45%, #053344 0%, #021E28 65%, #011219 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1), visibility 1.2s ease;
      padding: 20px;
    }

    .wei-envelope-box {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      max-width: min(440px, 90vw);
      max-height: 82vh;
      transition: transform 1.1s cubic-bezier(0.4, 0, 0.2, 1), filter 1.1s ease;
    }

    .wei-envelope-box.is-opening {
      transform: scale(1.06) translateY(-15px);
      filter: brightness(1.15) drop-shadow(0 25px 50px rgba(229, 195, 120, 0.35));
    }

    #weiImg {
      width: 100%;
      max-width: 440px;
      max-height: 76vh;
      display: block;
      object-fit: contain;
      filter: drop-shadow(0 20px 45px rgba(0, 0, 0, 0.7));
      border-radius: 6px;
    }

    /* Ambient Gold Shimmer on the RC Wax Seal */
    .wei-seal-glow {
      position: absolute;
      top: 48%;
      left: 50%;
      width: clamp(90px, 24vw, 130px);
      height: clamp(90px, 24vw, 130px);
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 175, 70, 0.5) 0%, rgba(229, 195, 120, 0.25) 50%, transparent 75%);
      pointer-events: none;
      animation: sealAura 2.6s ease-in-out infinite;
    }

    @keyframes sealAura {
      0%, 100% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.5; }
      50%      { transform: translate(-50%, -50%) scale(1.16); opacity: 0.95; }
    }

    #weiTapWrap {
      position: absolute;
      top: 61.5%;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      animation: weiTapIn 1.2s 0.8s both;
      pointer-events: none;
      z-index: 10;
    }

    @keyframes weiTapIn {
      from { opacity: 0; transform: translateX(-50%) translateY(8px); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    #weiTapLabel {
      font-family: var(--font-serif);
      font-size: clamp(10px, 2.5vw, 12px);
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #E5C378;
      animation: weiPulse 2.4s 1.6s ease-in-out infinite;
      white-space: nowrap;
      font-weight: 600;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9), 0 0 10px rgba(229, 195, 120, 0.6);
    }

    @keyframes weiPulse {
      0%, 100% { opacity: 0.6; letter-spacing: 0.28em; }
      50%      { opacity: 1;   letter-spacing: 0.32em; }
    }

    .wei-chevron {
      width: 10px;
      height: 10px;
      border-right: 1.8px solid #E5C378;
      border-top: 1.8px solid #E5C378;
      transform: rotate(-45deg);
      animation: weiChevron 2.4s 1.9s ease-in-out infinite;
      filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.9));
    }

    @keyframes weiChevron {
      0%, 100% { transform: rotate(-45deg) translate(0, 0); opacity: 0.6; }
      50%      { transform: rotate(-45deg) translate(2px, -2px); opacity: 1; }
    }

    /* ── FLOATING AUDIO BUTTON ── */
    #weiAudioBtn {
      position: fixed;
      bottom: max(20px, env(safe-area-inset-bottom, 20px));
      right: max(20px, env(safe-area-inset-right, 20px));
      width: clamp(46px, 11vw, 54px);
      height: clamp(46px, 11vw, 54px);
      background: linear-gradient(135deg, #741524, #480A13);
      border: 1.5px solid rgba(229, 195, 120, 0.6);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 99998;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
      visibility: hidden;
      opacity: 0;
      transition: opacity 0.4s ease, transform 0.2s ease, box-shadow 0.2s ease;
    }

    #weiAudioBtn:hover {
      transform: scale(1.08);
      box-shadow: 0 8px 24px rgba(229, 195, 120, 0.4);
    }

    #weiAudioBtn svg {
      width: 42%;
      height: 42%;
      fill: #F9F0E0;
    }

    /* ── MAIN INVITATION CONTAINER ── */
    #invitationApp {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      position: relative;
      background: #023548;
      box-shadow: 0 10px 60px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(197, 160, 89, 0.15);
      container-type: inline-size;
      container-name: inviteApp;
    }

    .invite-card {
      position: relative;
      width: 100%;
      display: block;
      overflow: hidden;
      line-height: 0;
      background: #023548;
      container-type: inline-size;
      container-name: card;
    }

    .invite-card-img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }

    /* ── PAGE 3: INTERACTIVE LIVE COUNTDOWN ── */
    .countdown-overlay {
      position: absolute;
      top: 24.6%;
      left: 7.6%;
      width: 84.8%;
      height: 5.2%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
      z-index: 10;
    }

    .countdown-arch-slot {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .countdown-digit {
      font-family: var(--font-serif);
      font-size: clamp(15px, 4.2cqw, 23px);
      font-weight: 700;
      color: #042431;
      line-height: 1;
      letter-spacing: 0.02em;
      filter: drop-shadow(0 1px 1px rgba(255, 255, 255, 0.5));
    }


    /* ── INTERACTIVE BUTTON HOTSPOTS (PAGES 5 & 6) ── */
    .hotspot-btn {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      cursor: pointer;
      border-radius: 30px;
      z-index: 20;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    .hotspot-btn:hover, .hotspot-btn:active {
      transform: scale(1.02);
      box-shadow: 0 0 20px rgba(229, 195, 120, 0.55);
      background-color: rgba(229, 195, 120, 0.08);
    }

    /* Page 5: Open in Maps */
    #btnPage5Maps {
      top: 84.4%;
      left: 20.8%;
      width: 58.4%;
      height: 5.6%;
    }

    /* Page 6: Open in Maps */
    #btnPage6Maps {
      top: 81.6%;
      left: 21.8%;
      width: 56.4%;
      height: 4.6%;
    }

    /* Page 6: Add to Calendar */
    #btnPage6Calendar {
      top: 87.2%;
      left: 21.8%;
      width: 56.4%;
      height: 4.6%;
    }

    /* ── PAGE 7: OVERLAY RSVP INTERACTION ── */
    .rsvp-overlay-input {
      position: absolute;
      top: 52.8%;
      left: 12.3%;
      width: 75.4%;
      height: 5.3%;
      background: #06313f;
      border: 1px solid rgba(197, 160, 89, 0.75);
      border-radius: 8px;
      padding: 0 16px;
      color: #FFFFFF;
      font-family: var(--font-sans);
      font-size: clamp(12px, 3.2cqw, 15px);
      font-weight: 400;
      outline: none;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.4);
      transition: border-color 0.2s, box-shadow 0.2s;
      z-index: 10;
    }

    .rsvp-overlay-input:focus {
      border-color: #E5C378;
      box-shadow: 0 0 12px rgba(229, 195, 120, 0.45), inset 0 2px 4px rgba(0, 0, 0, 0.4);
    }

    .rsvp-overlay-input::placeholder {
      color: rgba(229, 195, 120, 0.65);
      font-style: normal;
    }

    .rsvp-overlay-select-wrap {
      position: absolute;
      top: 64.5%;
      left: 12.3%;
      width: 75.4%;
      height: 5.6%;
      z-index: 10;
    }

    .rsvp-overlay-select {
      width: 100%;
      height: 100%;
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      background: #06313f;
      border: 1px solid rgba(197, 160, 89, 0.75);
      border-radius: 8px;
      padding: 0 38px 0 16px;
      color: #FFFFFF;
      font-family: var(--font-sans);
      font-size: clamp(12px, 3.2cqw, 15px);
      outline: none;
      cursor: pointer;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.4);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .rsvp-overlay-select:focus {
      border-color: #E5C378;
      box-shadow: 0 0 12px rgba(229, 195, 120, 0.45), inset 0 2px 4px rgba(0, 0, 0, 0.4);
    }

    .rsvp-overlay-select option {
      background: #02202B;
      color: #F7EFE4;
      padding: 10px;
    }

    .rsvp-overlay-chevron {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: #E5C378;
      font-size: 14px;
    }

    .rsvp-overlay-btn {
      position: absolute;
      top: 73.9%;
      left: 11.6%;
      width: 76.6%;
      height: 7.4%;
      background: transparent;
      border: none;
      border-radius: 35px;
      cursor: pointer;
      z-index: 10;
      -webkit-tap-highlight-color: transparent;
      outline: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .rsvp-overlay-btn:hover, .rsvp-overlay-btn:active {
      transform: scale(1.02);
      box-shadow: 0 0 25px rgba(229, 195, 120, 0.65);
      background-color: rgba(229, 195, 120, 0.08);
    }

    .rsvp-direct-google-link {
      position: absolute;
      top: 87.2%;
      left: 12%;
      width: 76%;
      height: 4%;
      z-index: 10;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      outline: none;
      border-radius: 12px;
    }

    .rsvp-direct-google-link:hover {
      background-color: rgba(229, 195, 120, 0.08);
    }

    /* Success State Modal Overlay */
    .rsvp-success-overlay {
      position: absolute;
      inset: 0;
      background: rgba(1, 24, 34, 0.94);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 30;
      animation: fadeIn 0.4s ease-out both;
    }

    .rsvp-success-box {
      width: 100%;
      max-width: 380px;
      border: 1.5px solid rgba(229, 195, 120, 0.65);
      border-radius: 18px;
      padding: clamp(24px, 5cqw, 36px) clamp(16px, 4cqw, 24px);
      text-align: center;
      background: radial-gradient(circle at 50% 30%, #053b4e 0%, #02232f 100%);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.65);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to   { opacity: 1; transform: scale(1); }
    }

    .rsvp-success-heart {
      color: #E5C378;
      font-size: 28px;
      margin-bottom: 8px;
      animation: pulseHeart 1.8s ease-in-out infinite;
    }

    @keyframes pulseHeart {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.2); }
    }

    .rsvp-success-title {
      font-family: var(--font-serif);
      font-size: clamp(16px, 4.2cqw, 20px);
      color: #E5C378;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .rsvp-success-msg {
      font-family: var(--font-sans);
      font-size: clamp(12px, 2.8cqw, 13.5px);
      color: #F7EFE4;
      line-height: 1.6;
      margin-bottom: 18px;
      max-width: 310px;
    }

    .rsvp-success-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      align-items: center;
    }

    .rsvp-google-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: linear-gradient(135deg, #F3DFAC 0%, #C5A059 50%, #9F7635 100%);
      color: #021E29;
      font-family: var(--font-serif);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-decoration: none;
      padding: 13px 24px;
      border-radius: 28px;
      box-shadow: 0 4px 20px rgba(229, 195, 120, 0.45);
      transition: transform 0.2s, box-shadow 0.2s;
      width: 100%;
      max-width: 270px;
    }

    .rsvp-google-btn:hover {
      transform: translateY(-1px) scale(1.02);
      box-shadow: 0 6px 26px rgba(229, 195, 120, 0.65);
      color: #011219;
    }

    .rsvp-reset-btn {
      background: transparent;
      border: 1px solid rgba(229, 195, 120, 0.4);
      color: rgba(229, 195, 120, 0.85);
      font-family: var(--font-serif);
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 8px 18px;
      border-radius: 20px;
      cursor: pointer;
      margin-top: 4px;
      transition: background-color 0.2s, color 0.2s;
    }

    .rsvp-reset-btn:hover {
      background: rgba(229, 195, 120, 0.15);
      color: #FFFFFF;
    }

    /* ── FOOTER ── */
    .footer-bar {
      padding: 24px 16px 40px;
      text-align: center;
      background: #023548;
      border-top: 1px solid rgba(197, 160, 89, 0.2);
    }

    .footer-tagline {
      font-family: var(--font-script);
      font-size: 26px;
      color: #E5C378;
      margin-bottom: 8px;
    }

    .footer-names {
      font-family: var(--font-serif);
      font-size: 11px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(247, 239, 228, 0.7);
    }
  </style>
</head>
<body>

  <!-- Background Music Audio: A Thousand Years by Christina Perri -->
  <audio id="weiAudio" loop preload="auto">
    <source src="media/A_Thousand_Years.m4a" type="audio/mp4">
    <source src="media/A_Thousand_Years.m4a" type="audio/x-m4a">
    <source src="media/A_Thousand_Years.m4a" type="audio/aac">
  </audio>

  <!-- Teal RC Wax Seal Envelope Opening Overlay -->
  <div id="weiOverlay" aria-label="Open your royal wedding invitation" role="button">
    <div class="wei-envelope-box" id="weiEnvelopeBox">
      <img id="weiImg"
        src="images/envelope_rc_teal.jpg"
        alt="Royal Wax Seal Envelope - Ryan & Cheryl"
        draggable="false"
      >
      <!-- Gold Shimmer Over Amber RC Wax Seal -->
      <div class="wei-seal-glow"></div>
      
      <!-- Tap to Open Indicator -->
      <div id="weiTapWrap">
        <div class="wei-chevron"></div>
        <div id="weiTapLabel">Tap to open</div>
      </div>
    </div>
  </div>

  <!-- Persistent Floating Music Button -->
  <div id="weiAudioBtn" title="Toggle Music: A Thousand Years" aria-label="Toggle Music: A Thousand Years">
    <svg id="weiIconPause" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" style="display:block">
      <rect x="6" y="5" width="4" height="14" rx="1"/>
      <rect x="14" y="5" width="4" height="14" rx="1"/>
    </svg>
    <svg id="weiIconPlay" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" style="display:none">
      <polygon points="6,4 20,12 6,20"/>
    </svg>
  </div>

  <!-- Main Invitation Booklet Container -->
  <main id="invitationApp">

    <!-- PAGE 1: HERO / ANNOUNCEMENT (Image 1) -->
    <section class="invite-card" id="page1" aria-label="The Wedding of Ryan and Cheryl">
      <img
        class="invite-card-img"
        src="images/page1_hero_ryan_cheryl.jpg"
        alt="The Wedding of Ryan & Cheryl - 03.12.2026 - Goa"
        loading="eager"
      />
    </section>

    <!-- PAGE 2: OUR FAVOURITE CHAPTER BEGIN (Image 2) -->
    <section class="invite-card" id="page2" aria-label="Our Favourite Chapter Begin">
      <img
        class="invite-card-img"
        src="images/page2_our_favourite_chapter.jpg"
        alt="Our favourite chapter begin - Together with our families, with love, you are invited - Dear friends and family"
        loading="lazy"
      />
    </section>

    <!-- PAGE 3: OUR CELEBRATION COUNTDOWN BEGINS (Image 3) -->
    <section class="invite-card" id="page3" aria-label="Wedding Countdown">
      <img
        class="invite-card-img"
        src="images/page3_countdown_clean.jpg"
        alt="Our Celebration Countdown Begins - Ryan & Cheryl"
        loading="lazy"
        onerror="this.src='images/page3_countdown.jpg';"
      />
      <!-- Dynamic Live Countdown Overlaid Directly Inside The 4 Arches -->
      <div class="countdown-overlay" id="countdownTimer" aria-live="polite">
        <div class="countdown-arch-slot">
          <span class="countdown-digit" id="cdDays">00</span>
        </div>
        <div class="countdown-arch-slot">
          <span class="countdown-digit" id="cdHours">00</span>
        </div>
        <div class="countdown-arch-slot">
          <span class="countdown-digit" id="cdMinutes">00</span>
        </div>
        <div class="countdown-arch-slot">
          <span class="countdown-digit" id="cdSeconds">00</span>
        </div>
      </div>
    </section>

    <!-- PAGE 4: EVERY LOVELY MOMENT (SCHEDULE) (Image 4) -->
    <section class="invite-card" id="page4" aria-label="Schedule of Events">
      <img
        class="invite-card-img"
        src="images/page4_schedule.jpg"
        alt="Every Lovely Moment: 11:00 AM Nuptials, 7:00 PM Reception, 8:30 PM Dance, 10:00 PM Dinner"
        loading="lazy"
      />
    </section>

    <!-- PAGE 5: THE NUPTIALS (HOLY SPIRIT CHURCH, MARGAO) (Image 5) -->
    <section class="invite-card" id="page5" aria-label="Church Nuptials Ceremony">
      <img
        class="invite-card-img"
        src="images/page5_church.png"
        alt="The Nuptials at Holy Spirit Church, Margao, Goa"
        loading="lazy"
      />
      <!-- Interactive Google Maps Link -->
      <a
        id="btnPage5Maps"
        class="hotspot-btn"
        href="https://www.google.com/maps/search/?api=1&query=Holy+Spirit+Church+Holy+Spirit+Road+Borda+Margao+Goa+403601"
        target="_blank"
        rel="noopener noreferrer"
        title="Open Holy Spirit Church in Google Maps"
        aria-label="Open Holy Spirit Church Margao in Google Maps"
      ></a>
    </section>

    <!-- PAGE 6: WHERE WE CELEBRATE (COSTA'S COUNTRYSIDE, VARCA) (Image 6) -->
    <section class="invite-card" id="page6" aria-label="Reception Venue: Costa's Countryside, Varca">
      <img
        class="invite-card-img"
        src="images/page6_venue.png"
        alt="Where We Celebrate - Costa's Countryside, Varca, Goa"
        loading="lazy"
      />
      <!-- Interactive Google Maps Link -->
      <a
        id="btnPage6Maps"
        class="hotspot-btn"
        href="https://www.google.com/maps/search/?api=1&query=Costa%27s+Countryside+Varca+Beach+Road+Varca+Goa+403721"
        target="_blank"
        rel="noopener noreferrer"
        title="Open Costa's Countryside in Google Maps"
        aria-label="Open Costa's Countryside Varca in Google Maps"
      ></a>
      <!-- Interactive Add to Calendar Link -->
      <a
        id="btnPage6Calendar"
        class="hotspot-btn"
        href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=The+Wedding+of+Ryan+%26+Cheryl&dates=20261203T053000Z/20261203T183000Z&details=Together+with+our+families%2C+we+joyfully+invite+you+to+celebrate+our+wedding.%0A%0A11%3A00+AM+-+Nuptials+at+Holy+Spirit+Church%2C+Margao%0A7%3A00+PM+-+Reception+at+Costa%27s+Countryside%2C+Varca%0A8%3A30+PM+-+Dance%0A10%3A00+PM+-+Dinner&location=Costa%27s+Countryside%2C+Varca+Beach+Road%2C+Varca%2C+Goa+403721%2C+India"
        target="_blank"
        rel="noopener noreferrer"
        title="Add to Google Calendar"
        aria-label="Add Ryan & Cheryl's Wedding to Google Calendar"
      ></a>
    </section>

    <!-- PAGE 7: THE PLEASURE OF YOUR COMPANY (RSVP) (Image 7) -->
    <section class="invite-card" id="page7" aria-label="RSVP Response">
      <img
        class="invite-card-img"
        src="images/page7_rsvp.png"
        alt="The pleasure of YOUR COMPANY - RSVP - Ryan & Cheryl"
        loading="lazy"
      />
      <!-- Interactive RSVP Form Overlaid Seamlessly -->
      <form id="rsvpForm" onsubmit="handleRsvpSubmit(event)">
        <!-- Guest Full Name Input Box -->
        <input
          type="text"
          id="guestName"
          name="guestName"
          class="rsvp-overlay-input"
          placeholder="Enter your full name"
          required
          autocomplete="name"
          aria-label="Your full name"
        />

        <!-- Attendance Dropdown Select Box -->
        <div class="rsvp-overlay-select-wrap">
          <select id="rsvpAttendance" name="rsvpAttendance" class="rsvp-overlay-select" required aria-label="Will you be joining us?">
            <option value="" disabled selected>Select your response</option>
            <option value="Joyfully Accept">Joyfully Accept</option>
            <option value="Respectfully Declines">Respectfully Declines</option>
          </select>
          <span class="rsvp-overlay-chevron">&#9662;</span>
        </div>

        <!-- Hotspot Submit Button -->
        <button type="submit" class="rsvp-overlay-btn" id="btnSubmitRsvp" title="RSVP Now — Open Google Form" aria-label="RSVP Now — Open Google Form">
        </button>

        <!-- Direct Hotspot on bottom text 'Tap RSVP Now to continue to our Google Form' -->
        <a
          href="https://docs.google.com/forms/d/e/1FAIpQLScojIoqsYnAEjXtaOXAbOTQoSQ5J8tMiFew-Gu9KrTIBbnRRA/viewform"
          target="_blank"
          rel="noopener noreferrer"
          class="rsvp-direct-google-link"
          title="Open Google Form"
          aria-label="Open Google Form"
        ></a>
      </form>

      <!-- Success Feedback Overlay Modal -->
      <div class="rsvp-success-overlay" id="rsvpSuccess">
        <div class="rsvp-success-box">
          <div class="rsvp-success-heart">&#9829;</div>
          <div class="rsvp-success-title">RSVP Submitted!</div>
          <p class="rsvp-success-msg" id="rsvpSuccessText"></p>
          <div class="rsvp-success-actions">
            <a id="rsvpGoogleFormBtn" href="https://docs.google.com/forms/d/e/1FAIpQLScojIoqsYnAEjXtaOXAbOTQoSQ5J8tMiFew-Gu9KrTIBbnRRA/viewform" target="_blank" rel="noopener noreferrer" class="rsvp-google-btn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
              </svg>
              <span>Open Google Form</span>
            </a>
            <button type="button" class="rsvp-reset-btn" onclick="resetRsvp()">Change Response</button>
          </div>
        </div>
      </div>
    </section>

    <!-- PAGE 8: THE BEGINNING OF OUR FOREVER (CLOSING CARD) (Image 8) -->
    <section class="invite-card" id="page8" aria-label="The Beginning of Our Forever - Ryan and Cheryl">
      <img
        class="invite-card-img"
        src="images/page8_last_page.jpg"
        alt="The Beginning of Our Forever - With all our love, Ryan & Cheryl - 03.12.2026 - Digital Wedding Invitation"
        loading="lazy"
      />
    </section>

    <!-- Footer -->
    <footer class="footer-bar">
      <div class="footer-tagline">Ryan &amp; Cheryl</div>
      <div class="footer-names">December 3, 2026 &bull; Costa's Countryside, Varca, Goa</div>
    </footer>

  </main>

  <script>
    /* ── TEAL RC ENVELOPE OPENING & "A THOUSAND YEARS" AUDIO LOGIC ── */
    (function () {
      var overlay     = document.getElementById('weiOverlay');
      var envBox      = document.getElementById('weiEnvelopeBox');
      var audio       = document.getElementById('weiAudio');
      var audioBtn    = document.getElementById('weiAudioBtn');
      var iconPause   = document.getElementById('weiIconPause');
      var iconPlay    = document.getElementById('weiIconPlay');
      var done        = false;

      function openEnvelope() {
        if (done) return;
        done = true;

        // Envelope unsealing visual feedback
        envBox.classList.add('is-opening');

        // Start playing "A Thousand Years"
        audio.volume = 0.85;
        var playPromise = audio.play();
        if (playPromise && playPromise.catch) {
          playPromise.catch(function () {
            // In case of browser strict autoplay policy
          });
        }

        // Smooth fade out of envelope overlay
        setTimeout(function () {
          overlay.style.opacity = '0';
          overlay.style.pointerEvents = 'none';
        }, 700);

        setTimeout(function () {
          overlay.style.display = 'none';
          // Show persistent music button
          audioBtn.style.visibility = 'visible';
          audioBtn.style.opacity = '1';
        }, 1800);
      }

      overlay.addEventListener('click', openEnvelope);
      overlay.addEventListener('touchstart', openEnvelope, { passive: true });

      // Audio toggle button handler
      audioBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        if (audio.paused) {
          audio.play();
          iconPlay.style.display = 'none';
          iconPause.style.display = 'block';
        } else {
          audio.pause();
          iconPlay.style.display = 'block';
          iconPause.style.display = 'none';
        }
      });
    })();

    /* ── DYNAMIC LIVE COUNTDOWN TO DECEMBER 3, 2026, 11:00 AM IST ── */
    (function () {
      // 3 December 2026, 11:00:00 GMT+05:30 (IST)
      var targetDate = new Date('2026-12-03T11:00:00+05:30').getTime();

      var elDays    = document.getElementById('cdDays');
      var elHours   = document.getElementById('cdHours');
      var elMinutes = document.getElementById('cdMinutes');
      var elSeconds = document.getElementById('cdSeconds');

      function padZero(num) {
        return num < 10 ? '0' + num : num.toString();
      }

      function updateCountdown() {
        var now = new Date().getTime();
        var diff = targetDate - now;

        if (diff <= 0) {
          elDays.textContent    = '00';
          elHours.textContent   = '00';
          elMinutes.textContent = '00';
          elSeconds.textContent = '00';
          return;
        }

        var days = Math.floor(diff / (1000 * 60 * 60 * 24));
        var hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        var minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        var seconds = Math.floor((diff % (1000 * 60)) / 1000);

        elDays.textContent    = padZero(days);
        elHours.textContent   = padZero(hours);
        elMinutes.textContent = padZero(minutes);
        elSeconds.textContent = padZero(seconds);
      }

      updateCountdown();
      setInterval(updateCountdown, 1000);
    })();

    /* ── RSVP FORM CONTROLLER (GOOGLE FORMS & SHEETS SYNC) ── */
    var GOOGLE_FORM_VIEW_URL = 'https://docs.google.com/forms/d/e/1FAIpQLScojIoqsYnAEjXtaOXAbOTQoSQ5J8tMiFew-Gu9KrTIBbnRRA/viewform';
    var GOOGLE_FORM_RESPONSE_URL = 'https://docs.google.com/forms/d/e/1FAIpQLScojIoqsYnAEjXtaOXAbOTQoSQ5J8tMiFew-Gu9KrTIBbnRRA/formResponse';
    var ENTRY_NAME = 'entry.1712310200';
    var ENTRY_ATTENDANCE = 'entry.281317823';

    function handleRsvpSubmit(e) {
      e.preventDefault();
      var successCard = document.getElementById('rsvpSuccess');
      var successText = document.getElementById('rsvpSuccessText');
      var googleBtn = document.getElementById('rsvpGoogleFormBtn');

      var nameInput = document.getElementById('guestName');
      var attendanceSelect = document.getElementById('rsvpAttendance');

      var name = nameInput.value.trim();
      var attendance = attendanceSelect.value;

      if (!name || !attendance) {
        return;
      }

      // Save locally in browser
      var rsvpData = {
        name: name,
        attendance: attendance,
        timestamp: new Date().toISOString()
      };
      try {
        localStorage.setItem('ryan_cheryl_rsvp', JSON.stringify(rsvpData));
      } catch (err) {}

      // Silently record directly into Google Forms & Google Sheets in the background
      try {
        var formData = new URLSearchParams();
        formData.append(ENTRY_NAME, name);
        formData.append(ENTRY_ATTENDANCE, attendance);

        fetch(GOOGLE_FORM_RESPONSE_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded'
          },
          body: formData.toString()
        }).catch(function () {});
      } catch (err) {}

      // Pre-filled Google Form link with their name and response
      var prefillUrl = GOOGLE_FORM_VIEW_URL + '?usp=pp_url&' + ENTRY_NAME + '=' + encodeURIComponent(name) + '&' + ENTRY_ATTENDANCE + '=' + encodeURIComponent(attendance);

      // Open Google Form in a new tab immediately
      try {
        window.open(prefillUrl, '_blank');
      } catch (openErr) {}

      // Update the button inside modal to point to the Google Form
      if (googleBtn) {
        googleBtn.href = prefillUrl;
      }

      // Display luxurious confirmation overlay
      successCard.style.display = 'flex';

      var isAttending = attendance.indexOf('Accept') !== -1;
      if (isAttending) {
        successText.innerHTML = 'Dear <strong>' + name + '</strong>,<br>We are truly overjoyed and look forward to celebrating our wedding with you at Costa\'s Countryside, Goa on December 3, 2026!<br><br><span style="color:#E5C378;font-size:12px;letter-spacing:0.04em;">Your response has been submitted to our Google Form.</span>';
      } else {
        successText.innerHTML = 'Dear <strong>' + name + '</strong>,<br>Thank you for letting us know. You will be dearly missed on our special day.<br><br><span style="color:#E5C378;font-size:12px;letter-spacing:0.04em;">Your response has been submitted to our Google Form.</span>';
      }
    }

    function resetRsvp() {
      var successCard = document.getElementById('rsvpSuccess');
      if (successCard) {
        successCard.style.display = 'none';
      }
    }

    /* Restore previously saved RSVP on page load */
    (function () {
      try {
        var saved = localStorage.getItem('ryan_cheryl_rsvp');
        if (saved) {
          var data = JSON.parse(saved);
          if (data.name) document.getElementById('guestName').value = data.name;
          if (data.attendance) document.getElementById('rsvpAttendance').value = data.attendance;
        }
      } catch (e) {}
    })();
  </script>
</body>
</html>
